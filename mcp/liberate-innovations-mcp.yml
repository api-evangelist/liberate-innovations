description: >-
  Liberate publishes no official hosted or remote Model Context Protocol server. No MCP endpoint,
  npm/PyPI MCP package, registry listing, or mcp.json manifest was found on any Liberate host or in
  the public registries. This file is a DERIVED candidate tool list computed from the two documented
  operations in openapi/liberate-innovations-orchestration-openapi.yml — a proposal for what a
  Liberate MCP server would expose, not a description of anything Liberate ships.

official:
