name: Liberate Orchestration Platform lifecycle
description: >-
  Versioning, release, and deprecation posture for the Liberate Orchestration Platform, gathered
  from the public developer hub and by probing Liberate's hosts. Liberate's published lifecycle
  story is about the workflows a customer authors — revisions, releases, environment promotion, and
  rollback — rather than about versioning the HTTP contract, which has remained a single documented
  v1.0 surface.

versioning:
  scheme: documentation version selector
  current_version: '1.0'
  in_url: false
  in_header: false
  policy_published: false
  notes: >-
    The developer hub carries a v1.0 selector. Neither documented operation carries a version
    segment or version header.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  notes: >-
    No deprecation policy, no notice window, and no RFC 8594 Sunset/Deprecation header usage are
    published. No operation in
    openapi/liberate-innovations-orchestration-openapi.yml is marked deprecated.

