sla:
  published: false
  notes: >-
    No public service level agreement. Commercial terms are handled through the Terms of Service
    and individual customer contracts.

release_management:
  published: true
  scope: customer-authored workflows
  docs: https://docs.liberateinc.com/docs/release-management
  capabilities:
    - name: Autosaving revisions
      detail: A revision is saved automatically whenever the workflow differs from the last saved state.
    - name: Version history
      detail: >-
        The full list of saved revisions is reachable from the "Version History" control at the top
        of the Liberate canvas.
    - name: Releases
      detail: >-
        A release can be cut from the current version or from any earlier revision. Both releases
        and revisions can carry release notes describing changes, updates, or bug fixes.
    - name: Environment promotion
      detail: >-
        Releases are deployed from the release tab to a chosen target environment — QA or
        production. Every customer has both.
    - name: Rollback
      detail: >-
        A previous known-good release can be redeployed to revert a problematic deployment.
  caveat: >-
    Rollback applies to workflow releases. The Entity Management documentation notes the platform
    does not have built-in rollback for uploaded CSV entity files, so replacing a current file
    affects all QA and production workflows that reference it.

changelog:
  published: true
  url: https://docs.liberateinc.com/changelog
  detail: changelog/liberate-innovations-changelog.yml

environments:
  - name: production
    per_tenant_url: true
  - name: qa
    per_tenant_url: true
