name: Liberate Orchestration Platform conformance assertions
description: >-
  Standards and cross-cutting conventions assessed against the Liberate Orchestration Platform API
  and against Liberate's published compliance claims. Assertions are grounded in the documented HTTP
  surface and the security page; an absent standard is recorded as conforms:false with the reason,
  never as an unverified pass.

standards:
  - id: rfc6750
    name: OAuth 2.0 Bearer Token Usage
    conforms: true
    evidence: >-
      Both documented operations authenticate with `Authorization: Bearer <token>`, the RFC 6750
      Authorization request header field syntax. Note this is bearer-token TRANSPORT only — tokens
      are provisioned by Liberate, not obtained through an OAuth 2.0 authorization flow.
    source: https://docs.liberateinc.com/docs/calling-a-workflow

  - id: oauth2
    name: OAuth 2.0 (RFC 6749) authorization framework
    conforms: false
    evidence: >-
      No authorization endpoint, token endpoint, grant type, or scope model is published for inbound
      access to the Liberate API. OAuth 2 appears only as an OUTBOUND Connection type used when a
      REST Task calls an external system, where the customer supplies a Token URL, Client ID, and
      Client Secret.
    source: https://docs.liberateinc.com/docs/connections

  - id: oidc
    name: OpenID Connect
    conforms: false
    evidence: >-
      No /.well-known/openid-configuration is served on any Liberate host. Console sign-in uses SAML
      2.0 brokered through Amazon Cognito, not OIDC for API access.
    source: well-known/liberate-innovations-well-known.yml

  - id: saml2
    name: SAML 2.0 single sign-on
    conforms: true
    scope: application console sign-in only (not the API)
    evidence: >-
      Documented custom SAML app setup against Google Workspace, with an Amazon Cognito ACS URL
      (https://<tenant>.auth.us-west-2.amazoncognito.com/saml2/idpresponse) and an Entity ID of the
      form urn:amazon:cognito:sp:<user-pool-id>. Confirmed by the security FAQ.
    source: https://docs.liberateinc.com/docs/google-workspace

  - id: rfc9457
    name: Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      No application/problem+json responses and no error envelope of any kind are documented.
    source: conventions/liberate-innovations-conventions.yml

  - id: idempotency
    name: Idempotency keys for safe retries
    conforms: false
    evidence: >-
      No idempotency key header, deduplication window, or retry-safety guarantee is documented.
      startWorkflow uses PUT but each call creates a new workflow session with a new Instance ID.
    source: conventions/liberate-innovations-conventions.yml

  - id: pagination
    name: Collection pagination
    conforms: false
    not_applicable: true
    evidence: >-
      The documented API exposes no list or collection endpoints, so pagination does not apply.

  - id: rfc8594
    name: Sunset HTTP header / deprecation signaling
    conforms: false
    evidence: No deprecation policy and no Sunset or Deprecation headers are documented.
    source: lifecycle/liberate-innovations-lifecycle.yml

  - id: openapi
    name: OpenAPI machine-readable description
    conforms: false
    evidence: >-
      Liberate publishes no OpenAPI document. The definition in openapi/ was generated by the API
      Evangelist pipeline from the documented request semantics and is not a provider artifact.

  - id: asyncapi
    name: AsyncAPI event description
    conforms: false
    not_applicable: true
    evidence: >-
      Liberate's asynchronous behavior is inbound (a caller POSTs an event to a paused workflow
      instance), not an outbound event stream or webhook catalog delivered to subscribers. There is
      no published event surface to describe.

  - id: json
    name: JSON request and response payloads
    conforms: true
    evidence: >-
      Both operations set Content-Type: application/json and carry JSON bodies.
    source: openapi/liberate-innovations-orchestration-openapi.yml

  - id: jsonata
    name: JSONata data transformation
    conforms: true
    evidence: >-
      Request Transformations, Response Transformations, and Mapping Tasks are all expressed as
      JSONata expressions; the documentation links to the JSONata specification.
    source: https://docs.liberateinc.com/docs/rest-task

