aid: liberate-innovations
name: Liberate Innovations
description: >-
  Liberate Innovations, Inc. (trading as Liberate) is a Palo Alto, California company building
  insurance-native AI agents for sales, servicing, and claims. Its voice, email, and SMS AI resolves
  customer inquiries end to end — verifying identity, gathering loss details, and filing a claim
  without a human rep — and writes the results straight into the carrier's or agency's core systems.
  Underneath the customer-facing agents sits the Liberate Orchestration Platform, a visual workflow
  engine where developers compose modular workflows from connections, events, tasks, and decision
  tables, with JSONata transformations, release management across QA and production environments, and
  correlation-level session reporting. The platform is driven over a small documented HTTP API that
  starts workflows by slug and advances paused instances with intermediate events. Liberate
  integrates with Guidewire, Duck Creek, Salesforce, Vertafore, Applied, EZLynx, Insuresoft,
  TurboRater, Verisk, CCC, CoreLogic, Snapsheet, and Microsoft Outlook.
